name: Expense Tracker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- PART 1: LINT & CODE QUALITY ---
  lint:
    name: Code Quality Check (Linting)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit cleanly even if formatting warnings exist
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # --- PART 2: DOCKER BUILD & INTEGRATION ---
  build:
    name: Docker Build & Test
    needs: lint  # Requires Part 1 (lint) to succeed first
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Services
        run: |
          docker compose build
