services:
  db:
    image: postgres:16-alpine
    container_name: expense-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-expense_tracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shared-network
    restart: unless-stopped

  secrets-init:
    image: hashicorp/vault:1.17
    container_name: expense-secrets-init
    working_dir: /project
    entrypoint: /bin/sh
    volumes:
      - ./script.sh:/project/script.sh:ro
      - ./backend:/project/backend
      - ./.env:/project/.env
    environment:
      VAULT_ADDR: "http://vault:8200"
    command:
      - -c
      - |
        apk add --no-cache bash jq
        bash ./script.sh || test -f ./backend/.env || touch ./backend/.env
    networks:
      - shared-network
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: Expense_Tracker/backend/dockerfile
    container_name: expense-backend
    ports:
      - "5000:5000"
    environment:
      PYTHONPATH: "/app"
      VAULT_ADDR: "http://vault:8200"
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-expense_tracker}"
    depends_on:
      - db
      - secrets-init
    networks:
      - shared-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  shared-network:
    external: true
